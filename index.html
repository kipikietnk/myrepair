<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dịch vụ đã ngừng hoạt động</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:        #0a0c0f;
      --surface:   #111418;
      --border:    #1e2329;
      --border-hi: #2a3140;
      --text-1:    #e8eaed;
      --text-2:    #8b949e;
      --text-3:    #4a5568;
      --amber:     #f0a045;
      --amber-dim: rgba(240, 160, 69, 0.10);
      --amber-glow:rgba(240, 160, 69, 0.04);
      --link:      #58a6ff;
      --link-hover:#79b8ff;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: var(--bg);
      color: var(--text-1);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      line-height: 1.6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      -webkit-font-smoothing: antialiased;
    }

    /* Ambient glow behind card */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 40% at 50% 30%, rgba(240,160,69,0.06) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .card {
      position: relative;
      z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border-hi);
      border-radius: 16px;
      max-width: 520px;
      width: 100%;
      padding: 48px 44px;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 24px 64px rgba(0,0,0,0.6);
    }

    /* Top amber accent line */
    .card::before {
      content: '';
      position: absolute;
      top: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--amber), transparent);
      border-radius: 9999px;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--amber-dim);
      border: 1px solid rgba(240,160,69,0.25);
      border-radius: 6px;
      padding: 5px 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--amber);
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
      box-shadow: 0 0 6px var(--amber);
      animation: pulse 2.4s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    h1 {
      font-size: 26px;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text-1);
      line-height: 1.3;
      margin-bottom: 14px;
    }

    .subtitle {
      font-size: 14px;
      font-weight: 400;
      color: var(--text-2);
      margin-bottom: 32px;
      line-height: 1.65;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 28px;
    }

    .redirect-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-3);
      margin-bottom: 14px;
      font-family: 'JetBrains Mono', monospace;
    }

    .link-block {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--amber-glow);
      border: 1px solid var(--border-hi);
      border-radius: 10px;
      padding: 14px 18px;
      text-decoration: none;
      transition: border-color 0.18s, background 0.18s;
      margin-bottom: 28px;
    }

    .link-block:hover {
      border-color: rgba(240,160,69,0.3);
      background: var(--amber-dim);
    }

    .link-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: rgba(240,160,69,0.12);
      border: 1px solid rgba(240,160,69,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .link-icon svg {
      width: 16px;
      height: 16px;
      stroke: var(--amber);
      fill: none;
    }

    .link-text {
      flex: 1;
    }

    .link-text strong {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-1);
      margin-bottom: 2px;
    }

    .link-text span {
      font-size: 12px;
      color: var(--text-3);
      font-family: 'JetBrains Mono', monospace;
    }

    .arrow {
      color: var(--text-3);
      transition: color 0.18s, transform 0.18s;
    }

    .link-block:hover .arrow {
      color: var(--amber);
      transform: translateX(3px);
    }

    .footer-note {
      font-size: 12px;
      color: var(--text-3);
      text-align: center;
      line-height: 1.6;
    }

    .footer-note a {
      color: var(--link);
      text-decoration: none;
    }

    .footer-note a:hover {
      color: var(--link-hover);
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .card {
        padding: 36px 28px;
      }
      h1 {
        font-size: 22px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .status-dot { animation: none; }
      .link-block, .arrow { transition: none; }
    }
  </style>
</head>
<body>
  <div class="card">

    <div class="status-badge">
      <span class="status-dot"></span>
      Đã ngừng hoạt động
    </div>

    <h1>Trang web này<br />không còn hoạt động</h1>

    <p class="subtitle">
      Dịch vụ tại địa chỉ này đã chính thức đóng cửa và không còn được duy trì.
      Toàn bộ nội dung và tính năng đã được chuyển sang nền tảng mới.
    </p>

    <div class="divider"></div>

    <p class="redirect-label">Truy cập tại đây</p>

    <a class="link-block" href="https://ilog.io.vn" target="_blank" rel="noopener noreferrer">
      <div class="link-icon">
        <svg viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="2" y1="12" x2="22" y2="12"/>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
        </svg>
      </div>
      <div class="link-text">
        <strong>ilog.io.vn</strong>
        <span>https://ilog.io.vn</span>
      </div>
      <svg class="arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </a>
  </div>
</body>
</html>
